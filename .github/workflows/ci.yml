name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # openapi.json is copied from the API repo. If the committed types no
      # longer match it, the frontend and backend contracts have drifted.
      - name: API types are in sync
        run: |
          pnpm gen:api
          git diff --exit-code src/types/api.ts \
            || (echo "::error::src/types/api.ts is stale. Run pnpm gen:api and commit." && exit 1)
