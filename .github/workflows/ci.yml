name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A manual run from the Actions tab: the same checks, and a deploy to
  # approve, without a commit to hang it on.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # openapi.json is copied from the API repo. If the committed types no
      # longer match it, the frontend and backend contracts have drifted.
      - name: API types are in sync
        run: |
          pnpm gen:api
          git diff --exit-code src/types/api.ts \
            || (echo "::error::src/types/api.ts is stale. Run pnpm gen:api and commit." && exit 1)

  # ---------------------------------------------------------------------------
  # Production: Cloudflare Pages. Runs only for a push to main that passed the
  # checks, only when DEPLOY_ENABLED=true, and only after approval in the
  # `production` environment. The VITE_* values are environment variables,
  # not secrets - they ship inside the bundle by design. See the API repo's
  # docs/RUNBOOK_DEPLOY.md section 3 for the one-time setup.
  # ---------------------------------------------------------------------------
  deploy:
    needs: check
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.WEB_URL }}
    concurrency:
      group: deploy-web
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for production
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          test -n "$VITE_SUPABASE_URL" -a -n "$VITE_SUPABASE_PUBLISHABLE_KEY" -a -n "$VITE_API_BASE_URL" \
            || { echo "::error::Set VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY and VITE_API_BASE_URL as production environment variables."; exit 1; }
          pnpm build
          test -f dist/_headers -a -f dist/_redirects

      # The project is created on first run, so the dashboard's "connect a
      # repository" wizard is never used: that path builds and deploys on
      # every push by itself, around the approval gate. A plain shell step:
      # the wrangler action runs each postCommands line as its own command,
      # which broke an if-block on the first real run.
      - name: Ensure the Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          if pnpm dlx wrangler@3.90.0 pages project list 2>/dev/null | grep -q "$CF_PAGES_PROJECT"; then
            echo "project $CF_PAGES_PROJECT exists"
          else
            pnpm dlx wrangler@3.90.0 pages project create "$CF_PAGES_PROJECT" --production-branch=main
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "3.90.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main --commit-dirty=true

      # Cloudflare applies _headers a few seconds after "Deployment complete",
      # so both checks retry together: the first real deploy saw the page
      # before its headers and failed on a one-shot header check.
      - name: Smoke the site
        env:
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          for i in $(seq 1 30); do
            body=$(curl -fsS "$WEB_URL/" || true)
            headers=$(curl -sS -D - -o /dev/null "$WEB_URL/" || true)
            if echo "$body" | grep -q "<title>AKIRA Ops</title>" \
               && echo "$headers" | grep -qi "content-security-policy"; then
              echo "site up with CSP after $i tries"; exit 0
            fi
            sleep 10
          done
          echo "::error::Within five minutes the site did not serve the app with its CSP header."
          echo "$headers" | head -20
          exit 1
